plugins { id 'com.android.application' }

android {
    namespace 'com.thangglobal.warehouse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thangglobal.warehouse'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

// Kotlin 1.8 merged the old jdk7/jdk8 stdlib artifacts into kotlin-stdlib.
// Exclude the legacy split artifacts pulled transitively by older AndroidX libraries.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
