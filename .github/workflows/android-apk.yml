name: Steam Card Farmer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 0.4.${{ github.run_number }}
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK for testing
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Card-Farmer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare release signing key
        if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_STORE_PASSWORD != '' }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_STORE_PASSWORD != '' }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Publish versioned GitHub Release
        if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_STORE_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Steam Card Farmer v${{ env.APP_VERSION }}
          target_commitish: main
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
