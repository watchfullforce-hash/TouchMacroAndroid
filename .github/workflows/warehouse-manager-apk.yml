name: Build Thang Global Warehouse APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'warehouse-manager/**'
      - '.github/workflows/warehouse-manager-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p warehouse-manager assembleDebug

      - name: Verify APK exists
        run: test -s warehouse-manager/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thang-global-warehouse-manager-apk
          path: warehouse-manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thang-warehouse-v0.1.0
          name: Thang Global Warehouse Manager v0.1.0
          body: Initial Android test build. Warehouse multi-account item indexing is not yet implemented or verified.
          files: warehouse-manager/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
          make_latest: false
